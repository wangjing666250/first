name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run lint
      - run: pnpm -w run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run test:run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      - run: pnpm run docs:build

  e2e-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pillar-ui/theme run build
      - run: pnpm exec playwright install --with-deps chromium
      # Rename committed baselines: "*-chromium-win32.png" → "*-chromium.png" so the
      # pathTemplate (which has no {platform} var) matches both on CI and local dev.
      - run: |
          for f in $(find play/e2e -name '*-chromium-win32.png'); do
            mv "$f" "${f%-chromium-win32.png}-chromium.png"
          done
          if [ -n "$(git status --porcelain)" ]; then
            branch="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(e2e): rename baselines to -chromium.png (platform-neutral)"
            # Push to the branch that triggered this workflow (works for both PR and direct push)
            git push "origin HEAD:$branch" 2>/dev/null || \
              git push "origin HEAD:${branch##*/}" 2>/dev/null || \
              echo "Skip push (no write permission or already on branch)"
          fi
      - run: pnpm test:e2e -u
      - name: Commit updated snapshots
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(e2e): update visual snapshots"
            git push "origin HEAD:${{ github.head_ref }}"
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore